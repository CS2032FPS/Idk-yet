<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANCTUM ⊞ - 3D Asylum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100%; height: 100%; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #b91c1c; font-size: 18px; font-weight: bold;
            pointer-events: none; z-index: 10; text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.6); padding: 12px 20px; border: 1px solid #3d0000;
        }
        #instructions {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.92); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #e5e5e5;
            z-index: 20; text-align: center; cursor: pointer; padding: 20px;
        }
        #instructions h1 { color: #b91c1c; font-size: 48px; margin-bottom: 12px; letter-spacing: 6px; }
        #instructions p { font-size: 16px; color: #a3a3a3; margin-bottom: 8px; max-width: 600px; line-height: 1.5; }
        #instructions .btn {
            margin-top: 24px; padding: 12px 32px; background: #880808;
            color: #fff; font-weight: bold; border: none; font-size: 18px;
            letter-spacing: 2px; cursor: pointer; border-radius: 2px;
        }
    </style>
    <!-- Three.js Engine Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hud">
        <div>LOCATION: SANCTUM ASYLUM</div>
        <div id="floor-display">FLOOR: 1 / 3</div>
        <div id="status-display">OBJECTIVE: Locate Central Elevator</div>
    </div>

    <div id="instructions">
        <h1>SANCTUM ⊞</h1>
        <p>You are trapped inside a 3-story psychiatric facility structured as a ⊞ grid layout.</p>
        <p><strong>WASD</strong> : Move | <strong>MOUSE</strong> : Look | <strong>F</strong> : Toggle Flashlight</p>
        <p><strong>E</strong> : Use Central Elevator / Stairs | <strong>SHIFT</strong> : Sprint</p>
        <button class="btn">ENTER FACILITY</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- Core Engine Variables ---
        let scene, camera, renderer;
        let flashlight, ambientLight;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Player state
        let currentFloor = 1; // 1, 2, or 3
        const floorHeights = { 1: 2, 2: 12, 3: 22 };
        let playerRadius = 0.6;
        let controlsLocked = false;
        let pitch = 0, yaw = 0;
        
        // Map Geometry Containers
        const collidableObjects = [];
        const floorElevators = [];

        // Initialize Engine
        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene & Camera Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.FogExp2(0x020204, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, floorHeights[1], 24);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 3. Lighting Setup
            ambientLight = new THREE.AmbientLight(0x111118, 0.6);
            scene.add(ambientLight);

            // Flashlight (SpotLight attached to player camera)
            flashlight = new THREE.SpotLight(0xfff5ea, 2.5, 25, Math.PI / 6, 0.4, 1);
            flashlight.castShadow = true;
            scene.add(flashlight);
            scene.add(flashlight.target);

            // 4. Build the 3-Story "⊞" Asylum Structure
            buildAsylumStructure();

            // 5. Input Listeners
            setupControls();

            window.addEventListener('resize', onWindowResize);
        }

        // --- "⊞" Map Construction ---
        function buildAsylumStructure() {
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x2b2d2f, roughness: 0.9, metalness: 0.1 });
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.8 });
            const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x0f0f10, roughness: 0.9 });
            const accentMaterial = new THREE.MeshStandardMaterial({ color: 0x880808, roughness: 0.5 });
            const elevatorMat = new THREE.MeshStandardMaterial({ color: 0x445566, metalness: 0.8, roughness: 0.2 });

            const mapSize = 60; // 60x60 perimeter
            const corridorWidth = 6;
            const wallHeight = 4;
            const wallThickness = 0.4;

            // Generate Floor 1, 2, and 3
            for (let f = 1; f <= 3; f++) {
                const yBase = (f - 1) * 10;

                // --- Floors and Ceilings ---
                const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize);
                const floorMesh = new THREE.Mesh(floorGeo, floorMaterial);
                floorMesh.rotation.x = -Math.PI / 2;
                floorMesh.position.set(0, yBase, 0);
                floorMesh.receiveShadow = true;
                scene.add(floorMesh);

                const ceilMesh = new THREE.Mesh(floorGeo, ceilingMaterial);
                ceilMesh.rotation.x = Math.PI / 2;
                ceilMesh.position.set(0, yBase + wallHeight, 0);
                scene.add(ceilMesh);

                // --- Outer Boundary Walls ---
                createWall(0, yBase + wallHeight/2, -mapSize/2, mapSize, wallHeight, wallThickness, wallMaterial); // North
                createWall(0, yBase + wallHeight/2, mapSize/2, mapSize, wallHeight, wallThickness, wallMaterial);  // South
                createWall(-mapSize/2, yBase + wallHeight/2, 0, wallThickness, wallHeight, mapSize, wallMaterial); // West
                createWall(mapSize/2, yBase + wallHeight/2, 0, wallThickness, wallHeight, mapSize, wallMaterial);  // East

                // --- Inner Cross Walls ("+" forming 4 quadrants: NW, NE, SW, SE) ---
                const quadSize = (mapSize - corridorWidth) / 2; // Size of quadrant room blocks
                const offset = quadSize / 2 + corridorWidth / 2;

                // Horizontal Partition Walls (Z-axis cross lines with door openings)
                createWallWithDoor(-offset, yBase + wallHeight/2, 0, quadSize, wallHeight, wallThickness, wallMaterial);
                createWallWithDoor(offset, yBase + wallHeight/2, 0, quadSize, wallHeight, wallThickness, wallMaterial);

                // Vertical Partition Walls (X-axis cross lines with door openings)
                createWallWithDoor(0, yBase + wallHeight/2, -offset, wallThickness, wallHeight, quadSize, wallMaterial);
                createWallWithDoor(0, yBase + wallHeight/2, offset, wallThickness, wallHeight, quadSize, wallMaterial);

                // Atmospheric Pointlights in Quadrants
                const colors = [0x334466, 0x663333, 0x336644, 0x554422];
                const quadPositions = [
                    [-offset, -offset], [offset, -offset],
                    [-offset, offset],  [offset, offset]
                ];

                quadPositions.forEach((pos, idx) => {
                    const light = new THREE.PointLight(colors[idx], 0.8, 12);
                    light.position.set(pos[0], yBase + 3, pos[1]);
                    scene.add(light);
                });

                // Central Elevator Platform at (0, 0)
                const elevatorGeo = new THREE.BoxGeometry(4, 0.2, 4);
                const elevator = new THREE.Mesh(elevatorGeo, elevatorMat);
                elevator.position.set(0, yBase + 0.1, 0);
                scene.add(elevator);
            }

            // Central Elevator Shaft Indicator Pillars
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 2) {
                const px = Math.cos(angle) * 2.2;
                const pz = Math.sin(angle) * 2.2;
                const shaftGeo = new THREE.CylinderGeometry(0.1, 0.1, 30);
                const shaft = new THREE.Mesh(shaftGeo, accentMaterial);
                shaft.position.set(px, 15, pz);
                scene.add(shaft);
            }
        }

        function createWall(x, y, z, w, h, d, mat) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            // Add bounding box for simple collision
            mesh.geometry.computeBoundingBox();
            const box = new THREE.Box3().setFromObject(mesh);
            collidableObjects.push(box);
        }

        function createWallWithDoor(x, y, z, w, h, d, mat) {
            // Split wall into two segments leaving a gap in the middle for passage
            if (w > d) {
                const segW = (w - 3) / 2;
                createWall(x - w/2 + segW/2, y, z, segW, h, d, mat);
                createWall(x + w/2 - segW/2, y, z, segW, h, d, mat);
            } else {
                const segD = (d - 3) / 2;
                createWall(x, y, z - d/2 + segD/2, w, h, segD, mat);
                createWall(x, y, z + d/2 - segD/2, w, h, segD, mat);
            }
        }

        // --- Controls & Input Handling ---
        function setupControls() {
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    controlsLocked = true;
                    instructions.style.display = 'none';
                } else {
                    controlsLocked = false;
                    instructions.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!controlsLocked) return;

                const movementX = e.movementX || 0;
                const movementY = e.movementY || 0;

                yaw -= movementX * 0.002;
                pitch -= movementY * 0.002;

                // Clamp vertical look angle
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'ShiftLeft': isSprinting = true; break;
                    case 'KeyF':
                        flashlight.visible = !flashlight.visible;
                        break;
                    case 'KeyE':
                        interactElevator();
                        break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'ShiftLeft': isSprinting = false; break;
                }
            });
        }

        function interactElevator() {
            // Check distance to central elevator hub at (0, 0)
            const distToCenter = Math.hypot(camera.position.x, camera.position.z);
            if (distToCenter < 3.5) {
                currentFloor = (currentFloor % 3) + 1; // Cycle 1 -> 2 -> 3 -> 1
                camera.position.y = floorHeights[currentFloor];
                
                document.getElementById('floor-display').innerText = `FLOOR: ${currentFloor} / 3`;
                document.getElementById('status-display').innerText = `ELEVATOR TRANSITION -> FLOOR ${currentFloor}`;
                
                setTimeout(() => {
                    document.getElementById('status-display').innerText = `EXPLORE QUADRANTS (FLOOR ${currentFloor})`;
                }, 2500);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (controlsLocked) {
                // Movement damping
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = isSprinting ? 14.0 : 7.0;

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * 10.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * 10.0 * delta;

                // Proposed movement
                const moveX = -velocity.x * delta;
                const moveZ = -velocity.z * delta;

                // Apply relative movement to camera facing direction
                const sin = Math.sin(yaw);
                const cos = Math.cos(yaw);

                const nextX = camera.position.x + (moveX * cos - moveZ * sin);
                const nextZ = camera.position.z + (moveX * sin + moveZ * cos);

                // Simple collision detection against asylum map bounds (-28 to +28)
                const bound = 28.5;
                if (Math.abs(nextX) < bound) camera.position.x = nextX;
                if (Math.abs(nextZ) < bound) camera.position.z = nextZ;

                // Lock camera pitch/yaw height relative to current floor level
                camera.position.y = floorHeights[currentFloor];

                // Update Flashlight position & spotlight target vector
                flashlight.position.copy(camera.position);
                const targetDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                flashlight.target.position.copy(camera.position).add(targetDir);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
